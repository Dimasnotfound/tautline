<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc">
  <title id="title">DevSpace MCP</title>
  <desc id="desc">ChatGPT MCP on your local machine with secure folder access and lightweight interactive widgets.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#09090b"/>
      <stop offset="0.55" stop-color="#111827"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity=".32"/>
    </filter>
  </defs>
  <rect width="1200" height="480" rx="28" fill="url(#bg)"/>
  <circle cx="1060" cy="65" r="170" fill="#2563eb" opacity=".13"/>
  <circle cx="1040" cy="430" r="230" fill="#7c3aed" opacity=".10"/>
  <g transform="translate(72 78)">
    <rect width="64" height="64" rx="17" fill="url(#accent)"/>
    <path d="M17 20h19l6 7h9v21H17z" fill="none" stroke="#fff" stroke-width="3" stroke-linejoin="round"/>
    <path d="M17 20v-4h17l6 6h11v5" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
    <text x="0" y="118" fill="#fff" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="52" font-weight="750">DevSpace MCP</text>
    <text x="0" y="162" fill="#cbd5e1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25">ChatGPT MCP on your local machine.</text>
    <text x="0" y="202" fill="#94a3b8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18">Open workspaces · Read and edit files · Run bounded commands</text>
    <g transform="translate(0 245)" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="650">
      <rect width="172" height="38" rx="19" fill="#0f172a" stroke="#334155"/>
      <text x="86" y="24" text-anchor="middle" fill="#bfdbfe">OAuth 2.0 + PKCE</text>
      <rect x="184" width="180" height="38" rx="19" fill="#0f172a" stroke="#334155"/>
      <text x="274" y="24" text-anchor="middle" fill="#ddd6fe">MCP Apps widgets</text>
      <rect x="376" width="171" height="38" rx="19" fill="#0f172a" stroke="#334155"/>
      <text x="461.5" y="24" text-anchor="middle" fill="#bbf7d0">Allowed-root sandbox</text>
    </g>
  </g>
  <g transform="translate(700 84)" filter="url(#shadow)">
    <rect width="420" height="310" rx="20" fill="#18181b" stroke="#3f3f46"/>
    <rect x="22" y="22" width="376" height="58" rx="13" fill="#232326" stroke="#3f3f46"/>
    <circle cx="51" cy="51" r="14" fill="#2563eb"/>
    <path d="M44 48h9l3 3h5v8H44z" fill="none" stroke="#fff" stroke-width="1.6"/>
    <text x="78" y="47" fill="#fafafa" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700">my-project</text>
    <text x="78" y="67" fill="#a1a1aa" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12">128 files · 24 folders</text>
    <g font-family="ui-monospace,Consolas,monospace" font-size="13">
      <rect x="22" y="96" width="376" height="150" rx="13" fill="#111827" stroke="#334155"/>
      <text x="43" y="126" fill="#94a3b8">▸</text><text x="65" y="126" fill="#e5e7eb">cmd/devspace</text>
      <text x="43" y="158" fill="#94a3b8">·</text><text x="65" y="158" fill="#e5e7eb">internal/tools.go</text>
      <text x="43" y="190" fill="#94a3b8">·</text><text x="65" y="190" fill="#e5e7eb">internal/oauth.go</text>
      <text x="43" y="222" fill="#94a3b8">·</text><text x="65" y="222" fill="#e5e7eb">README.md</text>
    </g>
    <rect x="22" y="262" width="184" height="30" rx="15" fill="#052e16" stroke="#166534"/>
    <text x="114" y="282" text-anchor="middle" fill="#86efac" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700">93.7% smaller preview*</text>
    <rect x="216" y="262" width="182" height="30" rx="15" fill="#172554" stroke="#1d4ed8"/>
    <text x="307" y="282" text-anchor="middle" fill="#93c5fd" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700">No frontend framework</text>
  </g>
</svg>
