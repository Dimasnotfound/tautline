<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Tautline v2</title>
  <desc id="desc">Tautline local MCP control plane for safe workspace tools, widgets, sub-agents, tunnels, and browser automation.</desc>
  <defs>
    <linearGradient id="background" x1="70" y1="20" x2="1120" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#111827"/>
      <stop offset="0.58" stop-color="#07111F"/>
      <stop offset="1" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="accent" x1="92" y1="90" x2="1090" y2="340" gradientUnits="userSpaceOnUse">
      <stop stop-color="#67E8F9"/>
      <stop offset="0.48" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#818CF8"/>
    </linearGradient>
    <radialGradient id="halo" cx="0" cy="0" r="1" gradientTransform="translate(250 190) rotate(31) scale(380 300)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0EA5E9" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#0EA5E9" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="420" rx="32" fill="url(#background)"/>
  <rect x="1.5" y="1.5" width="1197" height="417" rx="30.5" fill="none" stroke="#243244" stroke-width="3"/>
  <rect width="1200" height="420" rx="32" fill="url(#halo)"/>
  <g opacity="0.16" stroke="#64748B">
    <path d="M0 84H1200M0 168H1200M0 252H1200M0 336H1200"/>
    <path d="M120 0V420M240 0V420M360 0V420M480 0V420M600 0V420M720 0V420M840 0V420M960 0V420M1080 0V420"/>
  </g>
  <g transform="translate(74 66)">
    <rect width="286" height="286" rx="72" fill="#07111F" stroke="#334155" stroke-width="3"/>
    <g fill="none" stroke="url(#accent)" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
      <path d="M58 84H228" stroke-width="18"/>
      <path d="M143 84V212" stroke-width="18"/>
      <path d="M95 169L143 212L191 169" stroke-width="13"/>
    </g>
    <g fill="#E0F2FE" stroke="#07111F" stroke-width="7">
      <circle cx="58" cy="84" r="17"/>
      <circle cx="228" cy="84" r="17"/>
      <circle cx="143" cy="212" r="17"/>
    </g>
    <circle cx="143" cy="84" r="10" fill="#F8FAFC"/>
  </g>
  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="414" y="142" fill="#F8FAFC" font-size="68" font-weight="760" letter-spacing="-2">Tautline</text>
    <text x="782" y="142" fill="url(#accent)" font-size="34" font-weight="750">v2.1.0</text>
    <text x="416" y="202" fill="#CBD5E1" font-size="25" font-weight="520">A context-safe local MCP control plane.</text>
    <text x="416" y="249" fill="#94A3B8" font-size="19">Workspace tools · ChatGPT widgets · sub-agents · tunnels · Lightpanda</text>
    <g transform="translate(416 292)">
      <rect width="205" height="54" rx="27" fill="#0F1D2E" stroke="#334155"/>
      <circle cx="28" cy="27" r="7" fill="#22C55E"/>
      <text x="48" y="34" fill="#E2E8F0" font-size="16" font-weight="650">Local-first runtime</text>
      <rect x="223" width="196" height="54" rx="27" fill="#0F1D2E" stroke="#334155"/>
      <circle cx="251" cy="27" r="7" fill="#38BDF8"/>
      <text x="271" y="34" fill="#E2E8F0" font-size="16" font-weight="650">OAuth protected</text>
      <rect x="437" width="216" height="54" rx="27" fill="#0F1D2E" stroke="#334155"/>
      <circle cx="465" cy="27" r="7" fill="#A78BFA"/>
      <text x="485" y="34" fill="#E2E8F0" font-size="16" font-weight="650">Go single binary</text>
    </g>
  </g>
</svg>
